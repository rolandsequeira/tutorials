<!--
  AdBlock Guard: embedded site script.

  Everything here is inline on purpose. Nothing is loaded from a third-party
  server, so an ad blocker can't break the detector by blocking a script URL.

  Three layers, so the site is protected however the visitor blocks things:
    1. JavaScript detector: a bait element (catches cosmetic filtering) plus an
       optional ad-server probe (catches network blocking: Brave Shields,
       uBlock, DNS blockers).
    2. <noscript> fallback: shown when the browser runs no scripts at all
       (Brave "Block scripts", NoScript, uBlock's "no scripting" switch).
    3. Strict mode (fail closed): the message renders by default and is only
       removed once the detector has run and found nothing. Covers blockers
       that kill just this script while the rest of the page keeps running.

  The double-brace placeholders are Wix dynamic parameters, set by the dashboard page with
  embeddedScripts.embedScript(). See src/shared/config.ts.
-->
<!-- Strict-mode fallback. Kept first so build tools parse this file as body content. -->
<div class="abg-fc abg-fc--{{strict}} abg-lock-{{nsLock}} abg-brand-{{nsBranding}}">
  <input type="checkbox" id="abg-fc-x" class="abg-x" aria-hidden="true" tabindex="-1">
  <div class="abg-ov" role="dialog" aria-modal="true" aria-labelledby="abg-fc-t">
    <div class="abg-card">
      <h2 id="abg-fc-t">{{nsTitle}}</h2>
      <p>{{nsMessage}}</p>
      <a class="abg-btn" href="">Reload</a>
      <label class="abg-btn abg-btn--ghost" for="abg-fc-x">Continue anyway</label>
      <span class="abg-brand">Protected by AdBlock Guard</span>
    </div>
  </div>
</div>

<style>
  .abg-ns, .abg-fc { display: none; }
  .abg-ns--on, .abg-fc--on {
    display: block;
    --abg-accent: {{accent}};
    --abg-bg: {{bg}};
    --abg-fg: {{fg}};
  }
  .abg-fc--on {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    animation: abg-reveal 0s linear {{strictDelay}} forwards;
  }
  @keyframes abg-reveal { to { opacity: 1; visibility: visible; pointer-events: auto; } }
  html.abg-done .abg-fc { display: none !important; }
  .abg-x { position: absolute; opacity: 0; pointer-events: none; }
  .abg-x:checked + .abg-ov { display: none; }
  .abg-ov {
    position: fixed; inset: 0; z-index: 2147483646;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
    background: rgba(22, 45, 61, 0.55);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .abg-lock-on .abg-ov { background: rgba(22, 45, 61, 0.92); }
  .abg-card {
    max-width: 440px; width: 100%; box-sizing: border-box;
    padding: 28px 24px; border-radius: 12px; text-align: center;
    background: var(--abg-bg, #fff); color: var(--abg-fg, #162d3d);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
  }
  .abg-card h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; color: inherit; }
  .abg-card p { margin: 0 0 20px; color: inherit; }
  .abg-btn {
    display: inline-block; margin: 4px; padding: 10px 18px; border-radius: 18px;
    font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer;
    background: var(--abg-accent, #116dff); color: #fff; border: 0;
  }
  .abg-btn--ghost { background: transparent; color: var(--abg-accent, #116dff); }
  .abg-lock-on .abg-btn--ghost { display: none; }
  .abg-brand { display: block; margin-top: 16px; font-size: 12px; opacity: 0.6; }
  .abg-brand-off .abg-brand { display: none; }
</style>

<noscript>
  <!-- Scripts are off, so the fail-closed copy below would be a duplicate. -->
  <style>.abg-fc { display: none !important; }</style>
  <div class="abg-ns abg-ns--{{noscript}} abg-lock-{{nsLock}} abg-brand-{{nsBranding}}">
    <input type="checkbox" id="abg-ns-x" class="abg-x" aria-hidden="true" tabindex="-1">
    <div class="abg-ov" role="dialog" aria-modal="true" aria-labelledby="abg-ns-t">
      <div class="abg-card">
        <h2 id="abg-ns-t">{{nsTitle}}</h2>
        <p>{{nsMessage}}</p>
        <a class="abg-btn" href="">Reload</a>
        <label class="abg-btn abg-btn--ghost" for="abg-ns-x">Continue anyway</label>
        <span class="abg-brand">Protected by AdBlock Guard</span>
      </div>
    </div>
  </div>
</noscript>


<script>
(function () {
  'use strict';

  var RAW_CONFIG = '{{config}}';
  var AD_PROBE_URL = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
  var BAIT_CLASSES = 'adsbox ad-banner ad-placement adsbygoogle pub_300x250 pub_728x90 text-ad textAd text_ad text-ads banner_ad sponsored-ad';
  var SESSION_KEY = 'abg-dismissed';
  var root = document.documentElement;

  var DEFAULTS = {
    enabled: true, mode: 'modal',
    title: 'Ad blocker detected',
    message: 'This site is free because of the ads we show. Please allow ads for this site, then reload the page.',
    reloadText: "I've allowed ads, reload", dismissText: 'Continue anyway',
    accentColor: '#116DFF', backgroundColor: '#FFFFFF', textColor: '#162D3D',
    frequency: 'always', networkProbe: true, strictMode: false,
    showBranding: true, excludedPaths: []
  };

  function decodeConfig(raw) {
    try {
      if (!raw || raw.charAt(0) === '{') return {};
      var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var parsed = JSON.parse(new TextDecoder().decode(bytes));
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  var cfg = (function () {
    var out = {}, k, parsed = decodeConfig(RAW_CONFIG);
    for (k in DEFAULTS) out[k] = DEFAULTS[k];
    for (k in parsed) if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) out[k] = parsed[k];
    return out;
  })();

  function finish(result) {
    // Removes the fail-closed fallback (strict mode); the detector has run.
    root.classList.add('abg-done');
    try {
      window.dispatchEvent(new CustomEvent('adblockguard:result', { detail: result }));
    } catch (e) { /* very old browser */ }
  }

  function isExcluded() {
    var path = location.pathname || '/';
    for (var i = 0; i < cfg.excludedPaths.length; i++) {
      var p = cfg.excludedPaths[i];
      if (path === p || path.indexOf(p.replace(/\/$/, '') + '/') === 0) return true;
    }
    return false;
  }

  function wasDismissed() {
    if (cfg.frequency !== 'session' || cfg.mode === 'lock') return false;
    try { return sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) { return false; }
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // Cosmetic filtering: blockers hide or remove elements that look like ads.
  function checkBait() {
    var bait = document.createElement('div');
    bait.className = BAIT_CLASSES;
    bait.setAttribute('aria-hidden', 'true');
    bait.innerHTML = '&nbsp;';
    bait.style.cssText = 'position:absolute;left:-10000px;top:-10000px;width:2px;height:2px;';
    (document.body || root).appendChild(bait);
    return wait(350).then(function () {
      var blocked = !bait.isConnected;
      if (!blocked) {
        var cs = getComputedStyle(bait);
        blocked = cs.display === 'none' || cs.visibility === 'hidden' ||
          bait.offsetHeight === 0 || bait.offsetWidth === 0;
      }
      if (bait.parentNode) bait.parentNode.removeChild(bait);
      return blocked;
    });
  }

  // Network blocking: the request is cancelled before it leaves the browser.
  // A timeout or being offline counts as "not blocked", so slow networks
  // never produce a false alarm.
  function checkNetwork() {
    if (!cfg.networkProbe || !window.fetch) return Promise.resolve(false);
    var probe = fetch(AD_PROBE_URL + '?abg=' + Date.now(), {
      method: 'HEAD', mode: 'no-cors', cache: 'no-store', credentials: 'omit'
    }).then(function () { return false; }, function () { return navigator.onLine !== false; });
    return Promise.race([probe, wait(3000).then(function () { return false; })]);
  }

  function checkBrave() {
    try {
      if (navigator.brave && typeof navigator.brave.isBrave === 'function') {
        return navigator.brave.isBrave().then(Boolean, function () { return false; });
      }
    } catch (e) { /* ignore */ }
    return Promise.resolve(false);
  }

  function el(tag, attrs, text) {
    var node = document.createElement(tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    if (text) node.textContent = text;
    return node;
  }

  function randomId() {
    return 'x' + Math.random().toString(36).slice(2, 10);
  }

  // The message lives in a closed shadow root with a random host id, so
  // generic element-hiding rules can't target its contents.
  function buildOverlay(isBrave) {
    var host = el('div', { id: randomId() });
    host.style.cssText = 'all:initial;position:fixed;inset:0;z-index:2147483647;display:block;';
    if (cfg.mode === 'notice') host.style.cssText += 'top:auto;';
    var shadow = host.attachShadow ? host.attachShadow({ mode: 'closed' }) : host;

    var style = el('style');
    style.textContent =
      ':host{all:initial}' +
      '.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;' +
        'background:rgba(22,45,61,' + (cfg.mode === 'lock' ? '0.92' : '0.55') + ');' +
        'font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}' +
      '.ov.notice{inset:auto 0 0 0;background:none;padding:12px}' +
      '.card{max-width:440px;width:100%;box-sizing:border-box;padding:28px 24px;border-radius:12px;text-align:center;' +
        'background:' + cfg.backgroundColor + ';color:' + cfg.textColor + ';box-shadow:0 12px 40px rgba(0,0,0,.3)}' +
      '.notice .card{max-width:720px;margin:0 auto;padding:16px 20px}' +
      'h2{margin:0 0 8px;font-size:20px;line-height:1.3}p{margin:0 0 16px}' +
      '.hint{font-size:14px;opacity:.85}' +
      'button{margin:4px;padding:10px 18px;border-radius:18px;font:600 14px/1.2 inherit;cursor:pointer;border:0;' +
        'background:' + cfg.accentColor + ';color:#fff}' +
      'button.ghost{background:transparent;color:' + cfg.accentColor + '}' +
      '.brand{display:block;margin-top:14px;font-size:12px;opacity:.6}';
    shadow.appendChild(style);

    var ov = el('div', {
      'class': 'ov' + (cfg.mode === 'notice' ? ' notice' : ''),
      role: cfg.mode === 'notice' ? 'alert' : 'dialog',
      'aria-modal': cfg.mode === 'notice' ? 'false' : 'true',
      'aria-labelledby': 't'
    });
    var card = el('div', { 'class': 'card' });
    card.appendChild(el('h2', { id: 't' }, cfg.title));
    card.appendChild(el('p', {}, cfg.message));
    if (isBrave) {
      card.appendChild(el('p', { 'class': 'hint' },
        'Using Brave? Click the lion icon in the address bar and turn Shields off for this site.'));
    }
    var reload = el('button', { type: 'button' }, cfg.reloadText);
    reload.addEventListener('click', function () { location.reload(); });
    card.appendChild(reload);
    if (cfg.mode !== 'lock') {
      var dismiss = el('button', { type: 'button', 'class': 'ghost' }, cfg.dismissText);
      dismiss.addEventListener('click', function () {
        try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) { /* ignore */ }
        guard.stop();
        if (host.parentNode) host.parentNode.removeChild(host);
        root.style.overflow = '';
      });
      card.appendChild(dismiss);
    }
    if (cfg.showBranding) card.appendChild(el('span', { 'class': 'brand' }, 'Protected by AdBlock Guard'));
    ov.appendChild(card);
    shadow.appendChild(ov);
    return host;
  }

  // In lock mode, put the message back if something removes or hides it.
  var guard = {
    timer: null, observer: null,
    start: function (show) {
      if (cfg.mode !== 'lock') return;
      var check = function () { show(); };
      if (window.MutationObserver) {
        guard.observer = new MutationObserver(check);
        guard.observer.observe(document.body || root, { childList: true });
      }
      guard.timer = setInterval(check, 1000);
    },
    stop: function () {
      if (guard.observer) guard.observer.disconnect();
      if (guard.timer) clearInterval(guard.timer);
    }
  };

  function showMessage(isBrave) {
    var host = null;
    function show() {
      var visible = host && host.isConnected && getComputedStyle(host).display !== 'none' &&
        getComputedStyle(host).visibility !== 'hidden' && host.getAttribute('style') === host._abgStyle;
      if (visible) return;
      if (host && host.parentNode) host.parentNode.removeChild(host);
      host = buildOverlay(isBrave);
      host._abgStyle = host.getAttribute('style');
      (document.body || root).appendChild(host);
      if (cfg.mode !== 'notice') root.style.overflow = 'hidden';
    }
    show();
    guard.start(show);
  }

  function run() {
    if (!cfg.enabled || isExcluded() || wasDismissed()) {
      finish({ blocked: false, skipped: true });
      return;
    }
    Promise.all([checkBait(), checkNetwork(), checkBrave()]).then(function (r) {
      var result = { blocked: r[0] || r[1], cosmetic: r[0], network: r[1], brave: r[2] };
      if (result.blocked) showMessage(result.brave);
      finish(result);
    }, function () {
      finish({ blocked: false, error: true });
    });
  }

  if (document.body) run();
  else document.addEventListener('DOMContentLoaded', run);
})();
</script>
